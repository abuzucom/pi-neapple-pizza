name: Dependabot Changelog Companion

on:
  workflow_run:
    workflows: [Convention Sync Check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-companion:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # persist-credentials: true: this job pushes the generated changelog branch (Rule 11 exception).
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Configure generated commit identity
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create linked changelog draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/create_dependabot_changelog_pr.py
